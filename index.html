<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stable Money · Web Full-Funnel Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Inter — clean, professional UI sans (stands in for Circular). Swap for licensed brand font when available. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     STABLE MONEY — WEB FULL-FUNNEL DASHBOARD
     Visualization shell. Replace the DATA object (in <script>) with actuals.
     ============================================================ */
  :root{
    /* Brand */
    --sm-purple:#916CFF;
    --sm-purple-ink:#6b45e8;
    --sm-gold:#A28C6A;
    --sm-dark:#333333;
    --cream:#FFFAEF;

    /* Series (validated CVD-safe trio: purple / orange / aqua) */
    --s-organic:#916CFF;
    --s-direct:#EB6834;
    --s-rest:#1BAF7A;
    --s-fd:#916CFF;
    --s-bonds:#EB6834;

    /* Surfaces & ink (light) */
    --page:#F5F3EE;
    --surface:#FFFFFF;
    --surface-2:#FBFAF7;
    --ink:#1c1b19;
    --ink-2:#5c5a54;
    --muted:#8a887f;
    --grid:#e7e5dd;
    --axis:#cfccc2;
    --border:rgba(20,19,17,.10);

    --pos:#0f9d0f;
    --neg:#d03b3b;

    --radius:16px;
    --radius-sm:10px;
    --shadow:0 1px 2px rgba(20,19,17,.04), 0 6px 20px rgba(20,19,17,.05);
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --display:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  html[data-theme="dark"]{
    --page:#0e0e0d;
    --surface:#1a1a19;
    --surface-2:#161615;
    --ink:#f4f3ee;
    --ink-2:#c3c2b7;
    --muted:#8f8d84;
    --grid:#2b2b28;
    --axis:#3a3a36;
    --border:rgba(255,255,255,.10);
    --pos:#3ecb3e;
    --neg:#e66767;
    --s-organic:#a487ff;
    --s-direct:#f07a4b;
    --s-rest:#22c78c;
    --s-fd:#a487ff;
    --s-bonds:#f07a4b;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 24px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--page);color:var(--ink);
    font-family:var(--sans);font-size:14px;line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:40;
    background:color-mix(in srgb,var(--page) 88%,transparent);
    backdrop-filter:saturate(1.2) blur(10px);
    border-bottom:1px solid var(--border);
  }
  .bar{max-width:1240px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .logo{
    width:30px;height:30px;border-radius:9px;flex:none;
    background:radial-gradient(120% 120% at 30% 20%,#a98bff,var(--sm-purple));
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;
    font-family:var(--display);box-shadow:0 2px 8px rgba(145,108,255,.4);
  }
  .brand h1{font-family:var(--display);font-weight:600;font-size:18px;margin:0;letter-spacing:-.01em;white-space:nowrap}
  .brand .sub{color:var(--muted);font-size:12px;margin-top:1px}
  .spacer{flex:1}
  .tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);padding:4px;border-radius:12px}
  .tab{
    appearance:none;border:0;background:transparent;color:var(--ink-2);
    font:600 13px var(--sans);padding:8px 16px;border-radius:9px;cursor:pointer;transition:.15s;
  }
  .tab:hover{color:var(--ink)}
  .tab.active{background:var(--sm-purple);color:#fff;box-shadow:0 2px 8px rgba(145,108,255,.35)}
  .icon-btn{
    appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);
    width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px;display:grid;place-items:center;transition:.15s;
  }
  .icon-btn:hover{color:var(--ink);border-color:var(--axis)}

  /* ---------- Layout ---------- */
  main{max-width:1240px;margin:0 auto;padding:22px 24px 80px}
  .view-note{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    color:var(--ink-2);font-size:13px;margin:2px 0 22px;
  }
  .chip{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-weight:500}
  .chip b{color:var(--sm-purple)}

  section.block{margin-bottom:34px}
  .sec-head{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}
  .sec-head h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0;letter-spacing:-.01em}
  .sec-head .hint{color:var(--muted);font-size:12px}
  .badge-sample{font-size:11px;font-weight:600;color:var(--sm-gold);background:color-mix(in srgb,var(--sm-gold) 15%,transparent);border:1px solid color-mix(in srgb,var(--sm-gold) 35%,transparent);padding:2px 9px;border-radius:999px}
  .banner{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--sm-gold) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--sm-gold) 30%,transparent);color:var(--ink-2);border-radius:12px;padding:12px 14px;margin:0 0 22px;font-size:13px}
  .banner b{color:var(--ink)}

  .grid{display:grid;gap:16px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr}}

  /* ---------- Cards ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .kpi{padding:16px 16px 12px;display:flex;flex-direction:column;gap:8px;min-height:132px}
  .kpi .k-label{color:var(--ink-2);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px}
  .dot{width:9px;height:9px;border-radius:3px;flex:none}
  .kpi .k-val{font-family:var(--display);font-weight:600;font-size:30px;line-height:1;letter-spacing:-.02em}
  .kpi .k-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
  .delta{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:999px}
  .delta.up{color:var(--pos);background:color-mix(in srgb,var(--pos) 12%,transparent)}
  .delta.down{color:var(--neg);background:color-mix(in srgb,var(--neg) 12%,transparent)}
  .delta.flat{color:var(--muted);background:color-mix(in srgb,var(--muted) 14%,transparent)}
  .delta .vs{color:var(--muted);font-weight:500;margin-left:2px}
  .spark{width:100%;height:38px;display:block}
  .k-mini{width:100%;height:56px;display:block}

  /* ---------- Chart panels ---------- */
  .panel{padding:16px 18px 18px}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
  .panel-head .t{font-weight:600;font-size:14.5px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  .legend .li{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);font-size:12.5px;font-weight:500}
  .legend .li .swatch{width:12px;height:12px;border-radius:4px;flex:none}
  .chart-wrap{position:relative;width:100%}
  .chart-wrap svg{width:100%;height:auto;display:block;overflow:visible}
  .tip{
    position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-8px);
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    box-shadow:var(--shadow);padding:9px 11px;font-size:12px;z-index:5;min-width:130px;transition:opacity .1s
  }
  .tip .tt{font-weight:600;margin-bottom:6px;font-size:12px;color:var(--ink)}
  .tip .tr{display:flex;align-items:center;gap:8px;justify-content:space-between;margin:3px 0}
  .tip .tr .lab{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
  .tip .tr .val{font-weight:600;font-variant-numeric:tabular-nums}
  .tbl-btn{appearance:none;border:1px solid var(--border);background:var(--surface-2);color:var(--ink-2);font:600 12px var(--sans);padding:6px 11px;border-radius:8px;cursor:pointer}
  .tbl-btn:hover{color:var(--ink)}
  table.dt{width:100%;border-collapse:collapse;margin-top:14px;font-size:12.5px;display:none}
  table.dt.show{display:table}
  table.dt th,table.dt td{text-align:right;padding:7px 10px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
  table.dt th:first-child,table.dt td:first-child{text-align:left;font-variant-numeric:normal}
  table.dt thead th{color:var(--muted);font-weight:600;border-bottom:1px solid var(--axis)}
  footer{max-width:1240px;margin:0 auto;padding:0 24px 40px;color:var(--muted);font-size:12px}
  .hidden{display:none!important}

  /* ---------- MTD comparison table ---------- */
  .cmp-head{margin:2px 0 16px}
  .cmp-head h2{font-size:21px;font-weight:700;margin:0;letter-spacing:-.02em}
  .cmp-head p{color:var(--muted);font-size:13px;margin:5px 0 0}
  .cmp-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
  table.cmp{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
  table.cmp th,table.cmp td{padding:12px 20px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  table.cmp thead th{background:var(--surface-2);color:var(--muted);font-weight:600;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--axis)}
  table.cmp th:first-child,table.cmp td:first-child{text-align:left;font-variant-numeric:normal;position:sticky;left:0;background:var(--surface);z-index:1}
  table.cmp thead th:first-child{background:var(--surface-2)}
  table.cmp thead th.mlast{color:var(--sm-purple)}
  table.cmp thead th.dcol{color:var(--sm-purple)}
  table.cmp tbody tr{border-bottom:1px solid var(--border)}
  table.cmp tbody tr:last-child{border-bottom:0}
  table.cmp tbody tr:hover td{background:color-mix(in srgb,var(--sm-purple) 7%,transparent)}
  table.cmp tbody tr:hover td:first-child{background:color-mix(in srgb,var(--sm-purple) 7%,var(--surface))}
  tr.grp td{background:var(--surface-2);font-weight:700;color:var(--ink-2);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:10px 20px}
  tr.grp td:first-child{background:var(--surface-2)}
  tr.metric td{color:var(--ink)}
  tr.metric td:first-child{font-weight:600}
  tr.sub td{color:var(--ink-2);font-weight:400}
  tr.sub td:first-child{padding-left:38px;font-weight:400;color:var(--ink-2)}
  tr.sub td:first-child::before{content:"└ ";color:var(--muted)}
  td.last{font-weight:700}
  .d-up{color:var(--pos);font-weight:600}
  .d-down{color:var(--neg);font-weight:600}
  .d-flat{color:var(--muted);font-weight:500}
  /* higher specificity so the delta color beats `tr.metric td { color: ink }` */
  table.cmp td.d-up{color:var(--pos);font-weight:600}
  table.cmp td.d-down{color:var(--neg);font-weight:600}
  table.cmp td.d-flat{color:var(--muted);font-weight:500}
  .samp-tag{font-size:9.5px;font-weight:600;color:var(--sm-gold);border:1px solid color-mix(in srgb,var(--sm-gold) 40%,transparent);background:color-mix(in srgb,var(--sm-gold) 14%,transparent);padding:1px 6px;border-radius:6px;margin-left:8px;vertical-align:middle;letter-spacing:.02em;text-transform:none}
  .na-tag{color:var(--muted);border-color:var(--border);background:transparent}
  .cmp-legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:12px}
  .cmp-legend b{color:var(--ink-2);font-weight:600}

  /* ---------- MTD daily trend chart ---------- */
  .trend-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px 18px;margin-top:22px}
  .trend-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .trend-title{font-weight:700;font-size:17px;letter-spacing:-.01em}
  .trend-controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .tl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);font-weight:600}
  .tsel{font:500 13px var(--sans);color:var(--ink);background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:7px 10px;cursor:pointer}
  .tmode{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:3px}
  .tmode button{appearance:none;border:0;background:transparent;color:var(--ink-2);font:600 12px var(--sans);padding:6px 11px;border-radius:7px;cursor:pointer}
  .tmode button.on{background:var(--sm-purple);color:#fff}
  .tmonths{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .mchip{display:inline-flex;align-items:center;gap:7px;appearance:none;border:1px solid var(--border);background:var(--surface-2);color:var(--ink-2);font:600 12px var(--sans);padding:6px 11px;border-radius:999px;cursor:pointer;transition:.12s}
  .mchip.on{color:var(--ink);border-color:var(--mc)}
  .mchip .sw{width:10px;height:10px;border-radius:3px}
  .tnote{color:var(--muted);font-size:11.5px;margin-top:10px}
  .tip .sw2{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:middle}

  /* ---------- SEO traffic deep-dive ---------- */
  .seo-wrap{margin-top:26px}
  .total-row td{border-top:2px solid var(--axis);font-weight:700}
</style>
</head>

/* ============================================================================
   2) FORMATTERS & HELPERS
   ============================================================================ */
function fmtCount(v){
  if(v==null||isNaN(v)) return "–";
  const a=Math.abs(v);
  if(a>=1e7) return trim(v/1e7)+" Cr";
  if(a>=1e5) return trim(v/1e5)+" L";
  return Math.round(v).toLocaleString("en-IN");   // exact counts below 1 lakh (matches source board)
}
function trim(x){return x.toFixed(2).replace(/\.?0+$/,"");}
function fmtFull(v){return v==null?"–":Math.round(v).toLocaleString("en-IN");}
function fmtAum(v){return v==null?"–":"₹"+v.toLocaleString("en-IN")+" Cr";}
function fmt(v,kind){return kind==="aum"?fmtAum(v):fmtCount(v);}
function fmtCompact(v,kind){return kind==="aum"?("₹"+fmtCount(v).replace(" Cr"," Cr").replace(/Cr Cr/,"Cr")):fmtCount(v);}

function deltaPct(cur,prev){
  if(prev==null||cur==null||prev===0) return null;
  return (cur-prev)/prev*100;
}
function deltaHTML(cur,prev,vsLabel){
  const d=deltaPct(cur,prev);
  if(d==null) return `<span class="delta flat">—</span>`;
  const cls=d>0.05?"up":d<-0.05?"down":"flat";
  const arrow=d>0.05?"▲":d<-0.05?"▼":"▬";
  const sign=d>0?"+":"";
  return `<span class="delta ${cls}">${arrow} ${sign}${d.toFixed(1)}%<span class="vs">${vsLabel||""}</span></span>`;
}
function niceMax(m){
  if(m<=0) return 1;
  const p=Math.pow(10,Math.floor(Math.log10(m)));
  const n=m/p;
  const step=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;
  return step*p;
}
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const cvar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

   3) CHART PRIMITIVES  (dependency-free inline SVG)
   ============================================================================ */

// -- sparkline (MoM KPI cards): tiny line, last point emphasised
function sparkline(values,color){
  const W=220,H=38,p=4;
  const vals=values.filter(v=>v!=null);
  const max=Math.max(...vals),min=Math.min(...vals);
  const rng=(max-min)||1;
  const x=i=>p+(W-2*p)*i/((values.length-1)||1);
  const y=v=>H-p-(H-2*p)*(v-min)/rng;
  const pts=values.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const lx=x(values.length-1),ly=y(values[values.length-1]);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="3.2" fill="${color}" stroke="var(--surface)" stroke-width="2"/>
  </svg>`;
}

// -- mini bars (MTD KPI cards): 3 bars, current month in accent
function miniBars(values,labels,color,kind){
  const W=240,H=56,p=14,bw=Math.min(38,(W-2*p)/values.length*0.55);
  const max=niceMax(Math.max(...values.filter(v=>v!=null)));
  const gap=(W-2*p)/values.length;
  let s="";
  values.forEach((v,i)=>{
    const cx=p+gap*i+gap/2;
    const h=(H-16)*(v/max);
    const yy=H-14-h;
    const c=i===values.length-1?color:`color-mix(in srgb,${color} 34%,var(--surface))`;
    s+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" rx="4" fill="${c}"/>`;
    s+=`<text x="${cx.toFixed(1)}" y="${H-3}" text-anchor="middle" font-size="9" fill="var(--muted)">${labels[i]}</text>`;
  });
  return `<svg class="k-mini" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${s}</svg>`;
}

// -- full multi-series line chart with crosshair tooltip, legend, end-labels, table
let CID=0;
function lineChart({title,labels,series,kind}){
  const id="lc"+(++CID);
  const W=840,H=360,pad={l:58,r:104,t:14,b:34};
  const iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
  const all=series.flatMap(s=>s.values).filter(v=>v!=null);
  const max=niceMax(Math.max(...all)),min=0;
  const X=i=>pad.l+(labels.length===1?iw/2:iw*i/(labels.length-1));
  const Y=v=>pad.t+ih-ih*(v-min)/((max-min)||1);

  // gridlines + y ticks
  let grid="",yt="";
  const steps=4;
  for(let k=0;k<=steps;k++){
    const val=min+(max-min)*k/steps, yy=Y(val);
    grid+=`<line x1="${pad.l}" y1="${yy.toFixed(1)}" x2="${W-pad.r}" y2="${yy.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`;
    yt+=`<text x="${pad.l-10}" y="${(yy+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtCount(val)}</text>`;
  }
  // x labels
  let xl="";
  labels.forEach((l,i)=>{xl+=`<text x="${X(i).toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="11.5" fill="var(--ink-2)">${l}</text>`;});
  // lines + end dots + end labels
  let lines="",dots="",ends="";
  series.forEach(s=>{
    const pts=s.values.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
    lines+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((v,i)=>{dots+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;});
    const li=s.values.length-1;
    ends+=`<text x="${(X(li)+9).toFixed(1)}" y="${(Y(s.values[li])+4).toFixed(1)}" font-size="11.5" font-weight="600" fill="var(--ink-2)">${fmtCount(s.values[li])}</text>`;
  });
  // hover markers (hidden until move)
  let cross=`<line id="${id}-cx" x1="0" y1="${pad.t}" x2="0" y2="${pad.t+ih}" stroke="var(--axis)" stroke-width="1" opacity="0"/>`;

  const legend=series.map(s=>`<span class="li"><span class="swatch" style="background:${s.color}"></span>${s.name}</span>`).join("");
  // table
  const head=`<tr><th>Metric</th>${labels.map(l=>`<th>${l}</th>`).join("")}</tr>`;
  const rows=series.map(s=>`<tr><td>${s.name}</td>${s.values.map(v=>`<td>${fmt(v,kind)}</td>`).join("")}</tr>`).join("");

  const wrap=el("div","card panel");
  wrap.innerHTML=`
    <div class="panel-head">
      <div class="legend">${legend}</div>
      <button class="tbl-btn" data-tbl="${id}">Table</button>
    </div>
    <div class="chart-wrap">
      <svg id="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title||''}">
        ${grid}${yt}${xl}${cross}${lines}${dots}${ends}
        <rect id="${id}-hit" x="${pad.l}" y="${pad.t}" width="${iw}" height="${ih}" fill="transparent"/>
      </svg>
      <div class="tip" id="${id}-tip"></div>
    </div>
    <table class="dt" id="${id}-dt"><thead>${head}</thead><tbody>${rows}</tbody></table>`;

  // interaction (attach after mount)
  requestAnimationFrame(()=>{
    const svg=wrap.querySelector("#"+id);
    const tip=wrap.querySelector("#"+id+"-tip");
    const cx=wrap.querySelector("#"+id+"-cx");
    const hit=wrap.querySelector("#"+id+"-hit");
    const cwrap=wrap.querySelector(".chart-wrap");
    function move(ev){
      const r=svg.getBoundingClientRect();
      const px=(ev.clientX-r.left)/r.width*W;
      let i=Math.round((px-pad.l)/(iw/((labels.length-1)||1)));
      i=Math.max(0,Math.min(labels.length-1,i));
      const gx=X(i);
      cx.setAttribute("x1",gx);cx.setAttribute("x2",gx);cx.setAttribute("opacity","1");
      const rows=series.map(s=>`<div class="tr"><span class="lab"><span class="swatch" style="width:9px;height:9px;border-radius:3px;background:${s.color}"></span>${s.name}</span><span class="val">${fmt(s.values[i],kind)}</span></div>`).join("");
      tip.innerHTML=`<div class="tt">${labels[i]}</div>${rows}`;
      tip.style.opacity="1";
      const leftPx=gx/W*r.width;
      tip.style.left=Math.max(70,Math.min(r.width-70,leftPx))+"px";
      tip.style.top=(pad.t/H*r.height)+"px";
    }
    hit.addEventListener("mousemove",move);
    hit.addEventListener("mouseleave",()=>{tip.style.opacity="0";cx.setAttribute("opacity","0");});
  });
  return wrap;
}

// -- grouped bar chart (MTD): groups=months, series=channels
function groupedBars({labels,series,kind}){
  const id="gb"+(++CID);
  const W=840,H=340,pad={l:58,r:20,t:14,b:34};
  const iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
  const all=series.flatMap(s=>s.values).filter(v=>v!=null);
  const max=niceMax(Math.max(...all));
  const groups=labels.length, per=series.length;
  const gw=iw/groups, band=gw*0.66, bw=Math.min(30,band/per - 2);
  const Y=v=>pad.t+ih-ih*(v/max);
  let grid="",yt="";
  for(let k=0;k<=4;k++){const val=max*k/4,yy=Y(val);
    grid+=`<line x1="${pad.l}" y1="${yy.toFixed(1)}" x2="${W-pad.r}" y2="${yy.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`;
    yt+=`<text x="${pad.l-10}" y="${(yy+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtCount(val)}</text>`;}
  let bars="",xl="";
  labels.forEach((lab,g)=>{
    const gx=pad.l+gw*g+gw/2;
    xl+=`<text x="${gx.toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="11.5" fill="var(--ink-2)">${lab}</text>`;
    const total=(per*bw)+(per-1)*4;
    series.forEach((s,si)=>{
      const bx=gx-total/2+si*(bw+4);
      const v=s.values[g],h=ih*(v/max),yy=pad.t+ih-h;
      bars+=`<rect x="${bx.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" rx="4" fill="${s.color}"><title>${s.name} · ${lab}: ${fmt(v,kind)}</title></rect>`;
    });
  });
  const legend=series.map(s=>`<span class="li"><span class="swatch" style="background:${s.color}"></span>${s.name}</span>`).join("");
  const head=`<tr><th>Metric</th>${labels.map(l=>`<th>${l}</th>`).join("")}</tr>`;
  const rows=series.map(s=>`<tr><td>${s.name}</td>${s.values.map(v=>`<td>${fmt(v,kind)}</td>`).join("")}</tr>`).join("");
  const wrap=el("div","card panel");
  wrap.innerHTML=`
    <div class="panel-head"><div class="legend">${legend}</div><button class="tbl-btn" data-tbl="${id}">Table</button></div>
    <div class="chart-wrap"><svg id="${id}" viewBox="0 0 ${W} ${H}">${grid}${yt}${xl}${bars}</svg></div>
    <table class="dt" id="${id}-dt"><thead>${head}</thead><tbody>${rows}</tbody></table>`;
  return wrap;
}

// Shared comparison-table renderer (used by both Monthly and MTD views)
function buildCmpTable(root, d, {title, subtitle, realSet}){
  const months=d.months, n=months.length;
  const totalTraffic=d.traffic.organic.map((_,i)=>d.traffic.organic[i]+d.traffic.direct[i]+d.traffic.rest[i]);
  const get=p=>{ if(p==="_total")return totalTraffic; let o=d; p.forEach(k=>o=o[k]); return o; };
  const spec=[
    {group:"Common · Acquisition & Traffic"},
    {label:"Overall Traffic",   path:"_total",              kind:"count"},
    {label:"Organic",           path:["traffic","organic"], kind:"count", sub:true},
    {label:"Direct",            path:["traffic","direct"],  kind:"count", sub:true},
    {label:"Rest",              path:["traffic","rest"],    kind:"count", sub:true},
    {label:"Registrations",     path:["registrations"],     kind:"count"},
    {label:"App Installs",       path:["appInstalls"],       kind:"count"},
    {group:"Fixed Deposits (FD)"},
    {label:"FD Home Page Traffic", path:["homepage","fd"],       kind:"count"},
    {label:"FD New Users",         path:["fd","newUsers"],       kind:"count"},
    {label:"FD NU AUM",            path:["fd","nuAum"],          kind:"aum"},
    {label:"FD Total Users",       path:["fd","totalUsers"],     kind:"count"},
    {label:"FD Total Users AUM",   path:["fd","totalUsersAum"],  kind:"aum"},
    {group:"Bonds"},
    {label:"Bonds Home Page Traffic", path:["homepage","bonds"],     kind:"count"},
    {label:"Bonds New Users",         path:["bonds","newUsers"],     kind:"count"},
    {label:"Bonds NU AUM",            path:["bonds","nuAum"],        kind:"aum"},
    {label:"Bonds Total Users",       path:["bonds","totalUsers"],   kind:"count"},
    {label:"Bonds Total Users AUM",   path:["bonds","totalUsersAum"],kind:"aum"},
  ];
  function deltaCell(vals){
    const dd=deltaPct(vals[n-1],vals[n-2]);
    if(dd==null) return `<td class="d-flat">–</td>`;
    const cls=dd>0.05?"d-up":dd<-0.05?"d-down":"d-flat";      // green if positive, red if negative
    const arrow=dd>0.05?"↑":dd<-0.05?"↓":"→";
    return `<td class="${cls}">${arrow} ${dd>0?"+":""}${dd.toFixed(1)}%</td>`;
  }
  const head=`<thead><tr><th>Metric</th>${months.map((mo,i)=>`<th class="${i===n-1?'mlast':'mcol'}">${mo}</th>`).join("")}<th class="dcol">MoM % <span style="opacity:.7">(${months[n-2].split(" ")[0]}→${months[n-1].split(" ")[0]})</span></th></tr></thead>`;
  let body="";
  spec.forEach(row=>{
    if(row.group){ body+=`<tr class="grp"><td colspan="${n+2}">${row.group}</td></tr>`; return; }
    const vals=get(row.path);
    const allNull=vals.every(v=>v==null);
    const sample=!allNull && !realSet.has(row.label);
    const tag=allNull?`<span class="samp-tag na-tag">n/a</span>`:(sample?`<span class="samp-tag">sample</span>`:"");
    const cells=vals.map((v,i)=>`<td class="val ${i===n-1?'last':''}">${fmt(v,row.kind)}</td>`).join("");
    body+=`<tr class="metric${row.sub?" sub":""}"><td>${row.label}${tag}</td>${cells}${deltaCell(vals)}</tr>`;
  });
  const h=el("div","cmp-head"); h.innerHTML=`<h2>${title}</h2><p>${subtitle}</p>`; root.appendChild(h);
  const wrap=el("div","cmp-wrap"); wrap.innerHTML=`<table class="cmp">${head}<tbody>${body}</tbody></table>`; root.appendChild(wrap);
  const lg=el("div","cmp-legend");
  lg.innerHTML=`<span><b>Common</b> = product-agnostic (traffic, registrations, installs).</span>
    <span><b>FD</b> / <b>Bonds</b> = product-specific.</span>
    <span><b class="samp-tag">sample</b> = placeholder, awaiting export.</span>
    <span><span class="d-up">↑ green</span> = positive · <span class="d-down">↓ red</span> = negative MoM.</span>`;
  root.appendChild(lg);
}


// ---- SEO traffic deep-dive (category x month, Clicks/Impressions/CTR) ----
function buildSeoDeepdive(root){
  const S=SEO, months=S.months, n=months.length;
  let metric="clicks";
  const wrap=el("div","seo-wrap");
  const val=(cat,i)=>metric==="clicks"?cat.clicks[i]:metric==="impr"?cat.impr[i]:(cat.impr[i]?cat.clicks[i]/cat.impr[i]*100:null);
  const fmtV=v=>v==null?"–":(metric==="ctr"?v.toFixed(2)+"%":fmtCount(v));
  function dCell(a,b){if(a==null||b==null||b===0)return`<td class="d-flat">–</td>`;const d=(a-b)/b*100;const cls=d>0.05?"d-up":d<-0.05?"d-down":"d-flat";const ar=d>0.05?"↑":d<-0.05?"↓":"→";return`<td class="${cls}">${ar} ${d>0?"+":""}${d.toFixed(1)}%</td>`;}
  function draw(){
    const head=`<thead><tr><th>Category</th>${months.map((m,i)=>`<th class="${i===n-1?"mlast":"mcol"}">${m}</th>`).join("")}<th class="dcol">MoM % <span style="opacity:.7">(${months[n-2].split(" ")[0]}→${months[n-1].split(" ")[0]})</span></th></tr></thead>`;
    const ordered=S.categories.slice().sort((x,y)=>(val(y,n-1)||0)-(val(x,n-1)||0));
    let body="";
    ordered.forEach(cat=>{const cells=months.map((m,i)=>`<td class="val ${i===n-1?"last":""}">${fmtV(val(cat,i))}</td>`).join("");body+=`<tr class="metric"><td>${cat.name}</td>${cells}${dCell(val(cat,n-1),val(cat,n-2))}</tr>`;});
    const totAt=i=>{if(metric==="ctr"){const c=S.categories.reduce((s,x)=>s+x.clicks[i],0),im=S.categories.reduce((s,x)=>s+x.impr[i],0);return im?c/im*100:null;}return S.categories.reduce((s,x)=>s+(metric==="clicks"?x.clicks[i]:x.impr[i]),0);};
    const tv=[0,1,2,3].map(totAt);
    const totCells=tv.map((v,i)=>`<td class="val ${i===n-1?"last":""}">${fmtV(v)}</td>`).join("");
    body+=`<tr class="metric total-row"><td>Total</td>${totCells}${dCell(tv[n-1],tv[n-2])}</tr>`;
    wrap.querySelector(".cmp-wrap").innerHTML=`<table class="cmp">${head}<tbody>${body}</tbody></table>`;
  }
  wrap.innerHTML=`
   <div class="cmp-head" style="display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap">
     <div><h2>Traffic deep-dive — SEO by category</h2><p>Google Search Console · organic · ${S.window} window · pages classified by URL</p></div>
     <div class="tmode" id="seoMode"><button data-k="clicks" class="on">Clicks</button><button data-k="impr">Impressions</button><button data-k="ctr">CTR</button></div>
   </div>
   <div class="cmp-wrap"></div>
   <div class="cmp-legend"><span>Category priority: <b>FD → Bonds → RD → CC</b>, then the rest.</span><span>CTR = Clicks ÷ Impressions.</span><span><span class="d-up">↑ green</span> = up · <span class="d-down">↓ red</span> = down MoM.</span></div>`;
  root.appendChild(wrap);
  draw();
  wrap.querySelector("#seoMode").onclick=e=>{const b=e.target.closest("button");if(!b)return;metric=b.dataset.k;wrap.querySelectorAll("#seoMode button").forEach(x=>x.classList.toggle("on",x===b));draw();};
}

// ---- Rupee compact formatter (for AUM axes/tooltips in the trend chart) ----
function fmtRupee(v){
  if(v==null||isNaN(v))return"–";
  const a=Math.abs(v);
  if(a>=1e7)return"₹"+(v/1e7).toFixed(2).replace(/\.?0+$/,"")+" Cr";
  if(a>=1e5)return"₹"+(v/1e5).toFixed(2).replace(/\.?0+$/,"")+" L";
  if(a>=1e3)return"₹"+(v/1e3).toFixed(1).replace(/\.0$/,"")+"K";
  return"₹"+Math.round(v);
}

// ---- Daily trend chart (metric + month selectors, daily/cumulative) ----
function buildDailyTrend(root){
  const D=DAILY;
  const card=el("div","trend-card");
  const mcolL={May:"#2a78d6",Jun:"#1baf7a",Jul:"#eb6834",Aug:"#916cff"};
  const mcolD={May:"#3987e5",Jun:"#22c78c",Jul:"#f07a4b",Aug:"#a487ff"};
  const isDark=()=>{const t=document.documentElement.getAttribute("data-theme");if(t==="dark")return true;if(t==="light")return false;return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;};
  const mcol=()=>isDark()?mcolD:mcolL;
  let curMetric=D.metrics[0].id, sel=new Set(D.monthKeys), mode="daily";

  const groups=["Common","FD","Bonds"];
  const optg=groups.map(g=>{
    const opts=D.metrics.filter(m=>m.group===g).map(m=>`<option value="${m.id}">${m.label}</option>`).join("");
    return `<optgroup label="${g==="Common"?"Common · Acquisition":g}">${opts}</optgroup>`;
  }).join("");
  card.innerHTML=`
   <div class="trend-head">
     <div class="trend-title">Daily trend</div>
     <div class="trend-controls">
       <label class="tl">Metric <select class="tsel" id="tMetric">${optg}</select></label>
       <div class="tmode" id="tMode"><button data-mode="daily" class="on">Daily</button><button data-mode="cume">Cumulative (MTD)</button></div>
     </div>
   </div>
   <div class="tmonths" id="tMonths"></div>
   <div class="chart-wrap"><svg id="tSvg" viewBox="0 0 860 340"></svg><div class="tip" id="tTip"></div></div>
   <div class="tnote">Overlaid by day-of-month so months compare like-for-like. Aug is partial (to day ${D.data.reg.Aug.length}). Only metrics with daily data are selectable — channel-split traffic isn't (period totals only).</div>`;
  root.appendChild(card);

  const monthsBox=card.querySelector("#tMonths");
  const svg=card.querySelector("#tSvg"), tip=card.querySelector("#tTip"), metricSel=card.querySelector("#tMetric");
  const unit=()=>D.metrics.find(m=>m.id===curMetric).unit;
  const fmtY=v=>unit()==="aum"?fmtRupee(v):fmtCount(v);
  function seriesFor(mk){let a=(D.data[curMetric][mk]||[]).slice();if(mode==="cume"){let s=0;a=a.map(v=>{if(v==null)return null;s+=v;return s;});}return a;}
  function renderChips(){const c=mcol();monthsBox.innerHTML=D.monthKeys.map((mk,i)=>`<button class="mchip${sel.has(mk)?" on":""}" data-m="${mk}" style="${sel.has(mk)?`--mc:${c[mk]}`:""}"><span class="sw" style="background:${sel.has(mk)?c[mk]:"var(--muted)"}"></span>${D.months[i]}</button>`).join("");}

  function draw(){
    const c=mcol(), W=860,H=340,pad={l:64,r:16,t:14,b:30}, iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
    const active=D.monthKeys.filter(mk=>sel.has(mk));
    const sm={}; let maxDay=1,maxVal=0;
    active.forEach(mk=>{const a=seriesFor(mk);sm[mk]=a;maxDay=Math.max(maxDay,a.length);a.forEach(v=>{if(v!=null)maxVal=Math.max(maxVal,v);});});
    const ymax=niceMax(maxVal||1);
    const X=d=>pad.l+(maxDay<=1?0:iw*(d-1)/(maxDay-1));
    const Y=v=>pad.t+ih-ih*(v/ymax);
    let g="",yt="";
    for(let k=0;k<=4;k++){const val=ymax*k/4,yy=Y(val);g+=`<line x1="${pad.l}" y1="${yy.toFixed(1)}" x2="${W-pad.r}" y2="${yy.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`;yt+=`<text x="${pad.l-9}" y="${(yy+4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--muted)">${unit()==="aum"?fmtRupee(val):fmtCount(val)}</text>`;}
    let xl="";const step=maxDay>20?5:2;for(let d=1;d<=maxDay;d+=step){xl+=`<text x="${X(d).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${d}</text>`;}
    let lines="",dots="";
    active.forEach(mk=>{const a=sm[mk],col=c[mk];const pts=a.map((v,i)=>v==null?null:`${X(i+1).toFixed(1)},${Y(v).toFixed(1)}`).filter(Boolean).join(" ");if(pts)lines+=`<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;const li=a.length-1;if(a[li]!=null)dots+=`<circle cx="${X(li+1).toFixed(1)}" cy="${Y(a[li]).toFixed(1)}" r="3.4" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`;});
    const cross=`<line id="tcx" x1="0" y1="${pad.t}" x2="0" y2="${pad.t+ih}" stroke="var(--axis)" stroke-width="1" opacity="0"/>`;
    svg.innerHTML=`${g}${yt}${xl}${cross}${lines}${dots}<rect id="thit" x="${pad.l}" y="${pad.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
    const hit=svg.querySelector("#thit"),cx=svg.querySelector("#tcx");
    hit.onmousemove=ev=>{const r=svg.getBoundingClientRect();const px=(ev.clientX-r.left)/r.width*W;let d=Math.round((px-pad.l)/(iw/((maxDay-1)||1)))+1;d=Math.max(1,Math.min(maxDay,d));const gx=X(d);cx.setAttribute("x1",gx);cx.setAttribute("x2",gx);cx.setAttribute("opacity","1");const rows=active.map(mk=>{const v=sm[mk][d-1];return v==null?"":`<div class="tr"><span class="lab"><span class="sw2" style="background:${c[mk]}"></span>${D.months[D.monthKeys.indexOf(mk)]}</span><span class="val">${fmtY(v)}</span></div>`;}).join("");tip.innerHTML=`<div class="tt">Day ${d}${mode==="cume"?" · cumulative":""}</div>${rows}`;tip.style.opacity="1";const leftPx=gx/W*r.width;tip.style.left=Math.max(80,Math.min(r.width-80,leftPx))+"px";tip.style.top="6px";};
    hit.onmouseleave=()=>{tip.style.opacity="0";cx.setAttribute("opacity","0");};
  }

  renderChips(); metricSel.value=curMetric;
  metricSel.onchange=()=>{curMetric=metricSel.value;draw();};
  monthsBox.onclick=e=>{const b=e.target.closest(".mchip");if(!b)return;const mk=b.dataset.m;if(sel.has(mk)){if(sel.size>1)sel.delete(mk);}else sel.add(mk);renderChips();draw();};
  card.querySelector("#tMode").onclick=e=>{const b=e.target.closest("button");if(!b)return;mode=b.dataset.mode;card.querySelectorAll("#tMode button").forEach(x=>x.classList.toggle("on",x===b));draw();};
  draw();
}
